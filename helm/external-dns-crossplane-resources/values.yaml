# This chart was initially only used by the aws provider and did not contain any provider selection.
# Defaulting to `aws` safeguards against resources being removed due to missing new configuration.
provider: aws  # @schema enum: [aws, aks, azure]

# Values are inlined by cluster-aws in the HelmRelease spec
clusterName: ""

serviceAccount:
  name: external-dns
  namespace: kube-system

aws:
  accountID: ""
  awsPartition: ""
  oidcDomain: ""
  oidcDomains: []  # @schema item: string
  # DNS domain the external-dns instance manages. Record changes are limited to this domain
  # and its subdomains. Empty allows changes in every hosted zone of the account.
  managedDomain: ""

accountID: ""
awsPartition: ""
oidcDomain: ""
oidcDomains: []  # @schema item: string

awsRegion: ""
region: ""
awsCluster: {}  # @schema skipProperties: true; additionalProperties: true

azure:
  location: ""
  resourceGroupName: ""
  subscriptionID: ""
  mountPath: /etc/kubernetes
